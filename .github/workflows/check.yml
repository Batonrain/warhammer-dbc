name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Линтер
        run: npm run lint

      - name: Тесты
        run: npm test

      # Круговорот исходников: собрать компендиумы и извлечь обратно. Если
      # сборка что-то теряет или дописывает, извлечённое разойдётся с
      # исходником, и git покажет разницу.
      - name: Сборка компендиумов ничего не теряет
        run: |
          npm run packs:build
          npm run packs:unpack
          git diff --exit-code -- packs-src
